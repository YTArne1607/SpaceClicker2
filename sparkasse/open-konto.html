<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
  <link rel="stylesheet" href="style.css">
  <link href="https://db.onlinewebfonts.com/c/b51862d0d110bb81ea6ef748d0f78cbf?family=Sparkasse+Rg+Regular" rel="stylesheet">
<body>

  <div class="headline">

    <div id="h4_text">
    <h4>Schatzkasse - Die Sparkasse für Piraten</h4>
    </div>
    <img src="IMG_1344-removebg-preview.png" id="sparkasse_logo">
    <div class="line"></div>
  </div>

  <div class="centered">
    
    <h2>Konto eröffnen</h2>
    <br>
    <input class="input" type="text" placeholder="Vorname" id="vorname">
    <br>
    <br>
    <input class="input" type="text" placeholder="Nachname" id="nachname">
    <br>
    <br>
    <input class="input" type="email" placeholder="E-Mail" id="email">
  <br>
  <br>
  <br>
  <button class="btn-weiter" onclick="weiter()">Weiter</button>
  </div>
  
  <script src="script.js">
    
  </script>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
  </script>

  <script>
    (function(){
        emailjs.init({
          publicKey: "3OtfxBRzGHCLwjLvF",
        });
     })();

    var verifyCode = Math.floor(Math.random() * (999999 - 100000) + 100000);

    function weiter() {
      var templateParams = {
        name: document.getElementById("vorname").value + " " + document.getElementById("nachname").value,
        notes: 'Check this out!',
        email: document.getElementById("email").value,
        code: verifyCode
      };

      localStorage.setItem("vorname", document.getElementById("vorname").value);
      localStorage.setItem("nachname", document.getElementById("nachname").value);
      localStorage.setItem("email", document.getElementById("email").value);

      

      var templateId = "template_r3p5bwm";
      var serviceId = "service_schatzkasse";

      emailjs.send(serviceId, templateId, templateParams).then(
        (response) => {
          console.log('SUCCESS!', response.status, response.text);
        },
        (error) => {
          console.log('FAILED...', error);
        },
      );

      localStorage.setItem("verifyCode", verifyCode);

      setTimeout(function() {
        window.location.assign("verify.html");
      }, 2000)
      
    }
  </script>
  
</body>
</html>
